name: Build release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag, for example v2.1.0
        required: true
        type: string
permissions:
  contents: read
jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            platform: windows
          - os: macos-14
            platform: macos
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        if: matrix.platform == 'windows'
        with:
          dotnet-version: '10.0.x'
      - run: python -m pip install psutil filelock pillow packaging
      - run: python -m unittest discover -s ${{ matrix.platform }}/tests -p 'test_*.py' -v
      - run: python scripts/check_shared_ui.py
      - run: node tests/i18n.test.cjs
      - run: python -m unittest discover -s tests -v
      - run: node --check macos/web/generation.js
      - run: node --check macos/web/annotation.js
      - run: node --check macos/web/environment.js
      - run: node --check macos/web/i18n.js
      - run: ./windows/tests/python-discovery.ps1
        if: matrix.platform == 'windows'
        shell: powershell
      - run: ./windows/build.ps1
        if: matrix.platform == 'windows'
        shell: pwsh
      - name: Check standalone EXE resources
        shell: pwsh
        if: matrix.platform == 'windows'
        run: |
          $isolated = Join-Path $env:RUNNER_TEMP 'Standalone Qwen'
          New-Item $isolated -ItemType Directory -Force | Out-Null
          Copy-Item 'windows/app/Qwen Studio.exe' (Join-Path $isolated 'Qwen Studio.exe')
          $process = Start-Process (Join-Path $isolated 'Qwen Studio.exe') -ArgumentList '--check-resources' -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw 'Standalone EXE could not unpack its embedded resources.' }
      - run: ./macos/build.sh
        if: matrix.platform == 'macos'
      - name: Package
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: python scripts/package.py --platform '${{ matrix.platform }}' --version "${RELEASE_TAG#v}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.platform }}
          path: dist/*
          if-no-files-found: error
  draft:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: dist
          merge-multiple: true
      - name: Create draft and upload archives
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          version="${RELEASE_TAG#v}"
          git archive --format=zip --prefix="QwenStudio-$version-source/" HEAD -o "dist/QwenStudio-$version-source.zip"
          (cd dist && sha256sum *.zip *.exe > SHA256SUMS.txt)
          gh release view "$RELEASE_TAG" >/dev/null 2>&1 || gh release create "$RELEASE_TAG" --verify-tag --draft --title "Qwen Studio $version" --notes-file "docs/releases/$RELEASE_TAG.md"
          gh release upload "$RELEASE_TAG" dist/*.zip dist/*.exe dist/SHA256SUMS.txt --clobber
