name: Checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '10.0.x'
      - run: python -m pip install psutil filelock pillow packaging
      - run: python -m unittest discover -s windows/tests -p 'test_*.py' -v
      - run: python scripts/check_shared_ui.py
      - run: node tests/i18n.test.cjs
      - run: python -m unittest discover -s tests -v
      - run: node --check macos/web/generation.js
      - run: node --check macos/web/annotation.js
      - run: node --check macos/web/storage.js
      - run: node --check macos/web/environment.js
      - run: node --check macos/web/i18n.js
      - run: node --check windows/web/app.js
      - name: Parse setup scripts
        shell: pwsh
        run: |
          Get-ChildItem windows/*.ps1 | ForEach-Object {
            $parseErrors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($_.FullName,[ref]$null,[ref]$parseErrors)
            if ($parseErrors) { throw ($parseErrors | Out-String) }
          }
      - run: ./windows/tests/python-discovery.ps1
        shell: powershell
      - run: ./windows/build.ps1
        shell: pwsh
      - name: Check standalone EXE resources
        shell: pwsh
        run: |
          $isolated = Join-Path $env:RUNNER_TEMP 'Standalone Qwen'
          New-Item $isolated -ItemType Directory -Force | Out-Null
          Copy-Item 'windows/app/Qwen Studio.exe' (Join-Path $isolated 'Qwen Studio.exe')
          $process = Start-Process (Join-Path $isolated 'Qwen Studio.exe') -ArgumentList '--check-resources' -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw 'Standalone EXE could not unpack its embedded resources.' }
  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - run: python -m pip install psutil filelock pillow packaging
      - run: python -m unittest discover -s macos/tests -p 'test_*.py' -v
      - run: python scripts/check_shared_ui.py
      - run: node tests/i18n.test.cjs
      - run: python -m unittest discover -s tests -v
      - run: node --check macos/web/generation.js
      - run: node --check macos/web/annotation.js
      - run: node --check macos/web/storage.js
      - run: node --check macos/web/environment.js
      - run: node --check macos/web/i18n.js
      - run: node --check macos/web/app.js
      - run: zsh -n macos/setup.command macos/find-python.command macos/build.sh
      - run: ./macos/build.sh
