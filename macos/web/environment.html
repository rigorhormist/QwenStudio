<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self'; connect-src 'none'; object-src 'none'; base-uri 'none'"><title>Qwen Studio</title><link rel="stylesheet" href="environment.css"><script src="locale-data.js"></script><script src="i18n.js"></script></head><body>
<main class="environment"><header><span class="wordmark">Qwen Studio</span><label class="language"><span>界面语言</span><select id="language" aria-label="界面语言"><option value="auto">跟随系统</option><option value="zh">简体中文</option><option value="en">English</option></select></label></header>
<section class="intro"><h1>环境检测</h1><p class="lead">检测本机环境，准备开始创作。</p><p>首次使用需完成必需项目。模型文件可在进入后下载；Ollama 仅用于对话。</p></section>
<section class="environment-options" aria-label="环境配置">
<div class="python-choice"><label for="python-select">Python 解释器</label><div class="choice-line"><select id="python-select" aria-describedby="python-path python-hint"><option value="">正在查找已安装的 Python…</option></select><button id="python-browse">选择其他…</button></div><div class="directory-actions"><button id="python-existing">使用已有环境目录</button></div><p id="python-path" translate="no"></p><p id="python-hint">选择版本后，软件会检测该环境中的依赖。</p><p id="python-locked" hidden>Python 已由 QWEN_STUDIO_PYTHON 指定。移除该环境变量后可在此切换。</p></div>
<div class="source-choice"><label for="dependency-source">依赖下载源</label><select id="dependency-source"><option value="official">官方 PyPI</option><option value="tuna">清华大学镜像</option></select><div id="cuda-choice" hidden><label for="cuda-version">新装 CUDA 版本</label><select id="cuda-version"><option value="cu130">CUDA 13.0</option><option value="cu128">CUDA 12.8</option></select><p>已有可用的 CUDA 环境会直接复用。</p></div><p>适用于 Python 依赖。CUDA 和 Diffusers 源码仍从官方站点下载。</p></div>
<div class="dependency-directory"><label>依赖下载目录</label><p id="dependency-directory" translate="no"></p><button id="dependency-directory-browse">选择目录…</button><p>新环境、下载缓存和临时文件保存在此处。已有环境不会被移动。</p></div>
</section>
<section id="installation" class="installation" aria-label="安装进度" hidden><div class="progress-heading"><span id="install-stage" role="status" aria-live="polite"></span><span id="install-time" translate="no"></span></div><progress id="install-progress" aria-label="当前文件下载进度"></progress><p id="install-file" translate="no"></p><p id="install-bytes" translate="no"></p></section>
<div id="check-list" class="check-list" aria-label="依赖检查"></div>
<details id="diagnostics"><summary>查看详细日志</summary><pre id="log" translate="no"></pre></details>
<nav class="help" aria-label="环境检测"><button data-help="python">下载 Python</button><button data-help="webview" id="webview-help" hidden>下载 WebView2</button><button data-help="gpu" id="gpu-help">显卡驱动</button><button data-help="ollama">安装 Ollama</button></nav>
<footer><p id="summary" role="status" aria-live="polite">等待检测</p><div class="actions"><button id="recheck">重新检测</button><button id="install">安装或修复依赖</button><button id="cancel" hidden>停止</button><button class="primary" id="continue" disabled>进入 Qwen Studio</button></div><p>环境变化时，软件会重新进入此页面。</p></footer>
</main><script src="environment.js"></script></body></html>
